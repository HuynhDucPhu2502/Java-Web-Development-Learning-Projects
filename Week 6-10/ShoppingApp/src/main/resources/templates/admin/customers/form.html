<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${customer.id == null ? 'Add Customer' : 'Edit Customer'}"></title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body class="container mt-4">
<h2 th:text="${customer.id == null ? 'Add New Customer' : 'Edit Customer'}"></h2>

<form th:action="${customer.id == null} ? @{/admin/customers/create} : @{'/admin/customers/edit/' + ${customer.id}}"
      th:object="${customer}" method="post">

    <div class="mb-3">
        <label class="form-label">Phone Number</label>
        <input type="text" th:field="*{phoneNumber}" class="form-control" placeholder="e.g. 0901234567" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" th:field="*{name}" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Customer Since</label>
        <input type="date" th:field="*{customerSince}" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Status</label>
        <select th:field="*{isActive}" class="form-select">
            <option th:value="true">Active</option>
            <option th:value="false">Inactive</option>
        </select>
    </div>

    <button type="submit" class="btn btn-success">Save</button>
    <a th:href="@{/admin/customers}" class="btn btn-secondary">Cancel</a>
</form>
</body>
</html>
