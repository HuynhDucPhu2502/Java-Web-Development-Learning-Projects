<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Đăng nhập</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/home}">ShoppingApp</a>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="mb-4 text-center">Đăng nhập</h3>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Tên đăng nhập</label>
                            <input class="form-control" type="text" name="username"
                                   required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mật khẩu</label>
                            <input class="form-control" type="password" name="password" required>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Đăng nhập</button>
                    </form>

                    <div class="mt-3" th:if="${param.error}">
                        <div class="alert alert-danger mb-0">Sai thông tin đăng nhập</div>
                    </div>
                    <div class="mt-3" th:if="${param.logout}">
                        <div class="alert alert-success mb-0">Bạn đã đăng xuất</div>
                    </div>

                </div>
            </div>
            <p class="text-center text-muted mt-3 mb-0">
                Demo: user/123456 hoặc admin/123456
            </p>
        </div>
    </div>
</div>

</body>
</html>
