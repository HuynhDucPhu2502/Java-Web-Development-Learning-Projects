<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home Page</title>
</head>
<body>

<h1>FORM PAGE</h1>

<form th:action="@{/projects}" th:object="${project}" method="post">
    <div>
        <label>Name</label>
        <input th:field="*{name}">
    </div>
    <div>
        <label>description</label>
        <input th:field="*{description}">
    </div>
    <div>
        <label>startDate</label>
        <input th:field="*{startDate}" type="date">
    </div>
    <div>
        <label>dueDate</label>
        <input th:field="*{dueDate}" type="date">
    </div>
    <div>
        <label>budget</label>
        <input th:field="*{budget}" type="number">
    </div>

    <button type="submit">Save</button>
</form>


</body>
</html>
