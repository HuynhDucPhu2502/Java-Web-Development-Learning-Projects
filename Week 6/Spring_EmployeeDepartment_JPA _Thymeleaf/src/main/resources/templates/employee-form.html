<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? 'Sửa nhân viên' : 'Thêm nhân viên'"></title>
</head>
<body>
<h2 th:text="${isEdit} ? 'Sửa nhân viên' : 'Thêm nhân viên mới'"></h2>

<form th:object="${employeeDto}"
      th:action="${isEdit} ? @{/employees/update/{id}(id=${employeeId})} : @{/employees}"
      method="post">

    <label>Tên:</label>
    <input type="text" th:field="*{name}" required><br><br>

    <label>Tuổi:</label>
    <input type="number" th:field="*{age}" required><br><br>

    <label>Lương:</label>
    <input type="number" step="0.01" th:field="*{salary}" required><br><br>

    <label>Phòng ban:</label>
    <select th:field="*{departmentId}">
        <option value="">-- Chọn phòng ban --</option>
        <option th:each="dept : ${departments}"
                th:value="${dept.id}"
                th:text="${dept.name}">
        </option>
    </select><br><br>

    <button type="submit" th:text="${isEdit} ? 'Cập nhật' : 'Lưu'"></button>
</form>

<a th:href="@{/employees}">⬅ Quay lại danh sách</a>
</body>
</html>
