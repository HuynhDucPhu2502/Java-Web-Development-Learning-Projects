<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách nhân viên</title>
</head>
<body>
<h1>Danh sách nhân viên</h1>

<div style="margin-bottom: 15px;">
    <a th:href="@{/employees/new}">➕ Thêm nhân viên</a> |
    <a th:href="@{/departments}">🏢 Quản lý phòng ban</a>
</div>

<hr>
<h3>Tìm kiếm nâng cao</h3>

<form th:action="@{/employees/search}" method="get">
    <label>Tên:</label>
    <input type="text" name="name" placeholder="Nhập tên">

    <label>Tuổi:</label>
    <input type="number" name="age" placeholder="VD: 25">

    <label>Lương tối thiểu:</label>
    <input type="number" step="0.01" name="minSalary">

    <label>Lương tối đa:</label>
    <input type="number" step="0.01" name="maxSalary">

    <label>Phòng ban:</label>
    <select name="deptId">
        <option value="">-- Tất cả --</option>
        <option th:each="dept : ${departments}"
                th:value="${dept.id}"
                th:text="${dept.name}"></option>
    </select>

    <button type="submit">🔍 Tìm kiếm</button>
</form>

<hr>

<table border="1" cellpadding="5">
    <tr>
        <th>ID</th>
        <th>Tên</th>
        <th>Tuổi</th>
        <th>Lương</th>
        <th>Phòng ban</th>
        <th>Hành động</th>
    </tr>
    <tr th:each="emp : ${employees}">
        <td th:text="${emp.id}"></td>
        <td th:text="${emp.name}"></td>
        <td th:text="${emp.age}"></td>
        <td th:text="${emp.salary}"></td>
        <td th:text="${emp.department != null ? emp.department.name : 'N/A'}"></td>
        <td>
            <a th:href="@{'/employees/edit/' + ${emp.id}}">✏️ Sửa</a>
        </td>
    </tr>
</table>
</body>
</html>
