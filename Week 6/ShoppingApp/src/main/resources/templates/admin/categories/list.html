<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Categories</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body class="container mt-4">

<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Categories List</h2>
    <a class="btn btn-outline-secondary" th:href="@{/admin}">← Back to Dashboard</a>
</div>


<a class="btn btn-primary mb-3" th:href="@{/admin/categories/create}">+ Add New Category</a>

<table class="table table-striped">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="category : ${categories}">
        <td th:text="${category.id}"></td>
        <td th:text="${category.name}"></td>
        <td>
            <a th:href="@{'/admin/categories/edit/' + ${category.id}}" class="btn btn-warning btn-sm">Edit</a>
            <a th:href="@{'/admin/categories/delete/' + ${category.id}}"
               class="btn btn-danger btn-sm"
               onclick="return confirm('Delete this category?')">Delete</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
