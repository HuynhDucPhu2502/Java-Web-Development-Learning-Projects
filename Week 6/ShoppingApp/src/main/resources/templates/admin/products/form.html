<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.id == null ? 'Add Product' : 'Edit Product'}"></title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body class="container mt-4">
<h2 th:text="${product.id == null ? 'Add New Product' : 'Edit Product'}"></h2>

<form th:action="${product.id == null} ? @{/admin/products/create} : @{'/admin/products/edit/' + ${product.id}}"
      th:object="${product}" method="post">

    <div class="mb-3">
        <label class="form-label">Product Name</label>
        <input type="text" th:field="*{name}" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Category</label>
        <select th:field="*{category}" class="form-select" required>
            <option th:each="cat : ${categories}"
                    th:value="${cat}"
                    th:text="${cat.name}"
                    th:selected="${product.category != null and product.category.id == cat.id}">
            </option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Price</label>
        <input type="number" th:field="*{price}" class="form-control" step="0.01" required>
    </div>

    <div class="mb-3">
        <label class="form-label">In Stock</label>
        <select th:field="*{inStock}" class="form-select">
            <option th:value="true">Yes</option>
            <option th:value="false">No</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Status</label>
        <select th:field="*{isActive}" class="form-select">
            <option th:value="true">Active</option>
            <option th:value="false">Inactive</option>
        </select>
    </div>

    <button type="submit" class="btn btn-success">Save</button>
    <a th:href="@{/admin/products}" class="btn btn-secondary">Cancel</a>
</form>
</body>
</html>
