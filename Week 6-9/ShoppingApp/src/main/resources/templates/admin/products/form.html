<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.id == null ? 'Add Product' : 'Edit Product'}"></title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body class="container mt-4">

<h2 th:text="${product.id == null ? 'Add New Product' : 'Edit Product'}"></h2>

<form th:action="${product.id == null} ? @{/admin/products/create} : @{'/admin/products/edit/' + ${product.id}}"
      th:object="${product}" method="post">

    <!-- lỗi tổng quát PHẢI nằm trong form + không truyền 'all' -->
    <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger">
        Vui lòng kiểm tra lại các trường bên dưới.
    </div>

    <!-- Product Name -->
    <div class="mb-3">
        <label class="form-label">Product Name</label>
        <input type="text"
               th:field="*{name}"
               class="form-control"
               th:classappend="${#fields.hasErrors('name')} ? ' is-invalid'">
        <div class="invalid-feedback"
             th:if="${#fields.hasErrors('name')}"
             th:errors="*{name}"></div>
    </div>

    <!-- Category -->
    <div class="mb-3">
        <label class="form-label">Category</label>
        <select th:field="*{category.id}"
                class="form-select"
                th:classappend="${#fields.hasErrors('category')} ? ' is-invalid'">
            <option value="">-- Chọn category --</option>
            <option th:each="cat : ${categories}"
                    th:value="${cat.id}"
                    th:text="${cat.name}">
            </option>
        </select>
        <div class="invalid-feedback"
             th:if="${#fields.hasErrors('category')}"
             th:errors="*{category}"></div>
    </div>

    <!-- Price -->
    <div class="mb-3">
        <label class="form-label">Price</label>
        <input type="number"
               th:field="*{price}"
               class="form-control"
               step="0.01"
               th:classappend="${#fields.hasErrors('price')} ? ' is-invalid'">
        <div class="invalid-feedback"
             th:if="${#fields.hasErrors('price')}"
             th:errors="*{price}"></div>
    </div>

    <!-- In Stock -->
    <div class="mb-3">
        <label class="form-label">In Stock</label>
        <select th:field="*{inStock}"
                class="form-select"
                th:classappend="${#fields.hasErrors('inStock')} ? ' is-invalid'">
            <option th:value="true">Yes</option>
            <option th:value="false">No</option>
        </select>
        <div class="invalid-feedback"
             th:if="${#fields.hasErrors('inStock')}"
             th:errors="*{inStock}"></div>
    </div>

    <!-- Status -->
    <div class="mb-3">
        <label class="form-label">Status</label>
        <select th:field="*{isActive}" class="form-select">
            <option th:value="true">Active</option>
            <option th:value="false">Inactive</option>
        </select>
    </div>

    <button type="submit" class="btn btn-success">Save</button>
    <a th:href="@{/admin/products}" class="btn btn-secondary">Cancel</a>
</form>
</body>
</html>
