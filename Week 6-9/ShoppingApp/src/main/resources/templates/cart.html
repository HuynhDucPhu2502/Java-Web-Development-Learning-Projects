<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Giỏ hàng</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">ShoppingApp</a>

        <div class="ms-auto d-flex gap-2">
            <a class="btn btn-outline-light btn-sm" th:href="@{/shopping}">Tiếp tục mua sắm</a>
        </div>
    </div>
</nav>

<div class="container py-4">
    <h2 class="mb-3">Giỏ hàng</h2>

    <div th:if="${#lists.isEmpty(items)}" class="alert alert-info">
        Giỏ hàng trống.
    </div>

    <div th:if="${!#lists.isEmpty(items)}">
        <table class="table table-bordered align-middle">
            <thead>
            <tr>
                <th>Sản phẩm</th>
                <th class="text-end">Giá</th>
                <th class="text-center">Số lượng</th>
                <th class="text-end">Thành tiền</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${items}">
                <td th:text="${item.name}">Tên SP</td>
                <td class="text-end"
                    th:text="${#numbers.formatDecimal(item.price,0,'POINT',0,'COMMA')} + ' ₫'">0 ₫
                </td>
                <td class="text-center">
                    <form th:action="@{/cart/update}" method="post" class="d-inline-flex">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" name="productId" th:value="${item.productId}">
                        <input type="number" name="quantity"
                               class="form-control form-control-sm me-2"
                               style="width:80px" min="0"
                               th:value="${item.quantity}">
                        <button class="btn btn-sm btn-outline-primary" type="submit">Cập nhật</button>
                    </form>
                </td>
                <td class="text-end"
                    th:text="${#numbers.formatDecimal(item.total,0,'POINT',0,'COMMA')} + ' ₫'">0 ₫
                </td>
                <td class="text-center">
                    <a th:href="@{'/cart/remove/' + ${item.productId}}"
                       class="btn btn-sm btn-outline-danger">X</a>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="d-flex justify-content-between align-items-center mt-3 mb-4">
            <a th:href="@{/cart/clear}" class="btn btn-outline-secondary">Xóa giỏ hàng</a>
            <h4 class="mb-0">
                Tổng:
                <span class="text-danger fw-bold"
                      th:text="${#numbers.formatDecimal(total,0,'POINT',0,'COMMA')} + ' ₫'">0 ₫</span>
            </h4>
        </div>

        <!-- Form nhập thông tin khách hàng -->
        <form th:action="@{/cart/checkout}" method="post" class="border p-3 rounded bg-white shadow-sm">
            <div class="mb-3">
                <label class="form-label fw-bold">Số điện thoại</label>
                <input type="text" class="form-control" id="phoneNumber" name="customerPhone" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Tên khách hàng</label>
                <input type="text" class="form-control" id="customerName" name="customerName" readonly>
            </div>

            <div class="text-danger mb-3 fw-bold" th:text="${error}"></div>
            <div class="text-success mb-3 fw-bold" th:text="${success}"></div>

            <button type="submit" class="btn btn-success w-100">Đặt hàng</button>
        </form>
    </div>
</div>

<script>
    document.getElementById('phoneNumber').addEventListener('input', async function () {
        const phone = this.value.trim();
        const nameInput = document.getElementById('customerName');

        if (phone.length >= 6) {
            try {
                const res = await fetch(`/cart/customer?phoneNumber=${phone}`);
                if (!res.ok) return;
                const data = await res.json();
                nameInput.value = data.found ? data.name : '';
            } catch (err) {
                console.error(err);
            }
        } else {
            nameInput.value = '';
        }
    });
</script>
</body>
</html>
