<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <title>Home</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/home}">ShoppingApp</a>
        <div class="d-flex">
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-outline-light btn-sm" type="submit">Đăng xuất</button>
            </form>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="mb-3">Trang chủ</h3>
                    <p class="mb-1">Xin chào, <b th:text="${username}">user</b>!</p>
                    <p class="text-muted">
                        Quyền hiện tại:
                        <span class="badge bg-primary me-1"
                              th:each="r : ${roles}"
                              th:text="${r}">ROLE_USER</span>
                    </p>

                    <hr/>

                    <div class="d-flex gap-2">
                        <!-- Nút cho USER -->
                        <a class="btn btn-success"
                           sec:authorize="hasAnyRole('USER', 'ADMIN')"
                           th:href="@{/shopping}">
                            Qua trang Shopping
                        </a>

                        <!-- Nút cho ADMIN -->
                        <a class="btn btn-warning"
                           sec:authorize="hasRole('ADMIN')"
                           th:href="@{/admin}">
                            Vào khu vực Quản trị
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
