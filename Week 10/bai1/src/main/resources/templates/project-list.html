<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ADMIN PAGE</title>
</head>
<body>

<h1>Project List Page</h1>

<p>Chào <span th:text="${name}"></span>, bạn có vai trò là <span th:text="${roleName}"></span></p>

<form th:action="@{/logout}" method="post">
    <button type="submit">Đăng xuất</button>
</form>

<div th:if="${roleName.contains('ADMIN')}">
    <a th:href="@{/projects/form}">New Project</a>
</div>

<table border="1" width="80%">
    <tr>
        <th>id</th>
        <th>name</th>
        <th>description</th>
        <th>startDate</th>
        <th>dueDate</th>
        <th>budget</th>
        <th>action</th>
    </tr>

    <tr th:each="p : ${projects}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.name}"></td>
        <td th:text="${p.description}"></td>
        <td th:text="${p.startDate}"></td>
        <td th:text="${p.dueDate}"></td>
        <td th:text="${p.budget}"></td>
        <td>
            <a th:href="@{/projects/form(id=${p.id})}">Cập nhật</a>

            <form th:action="@{/projects/delete/{id}(id=${p.id})}" method="post">
                <button type="submit">Xóa</button>
            </form>

        </td>
    </tr>
</table>


</body>
</html>
